server:
  port: "8282"
  read_timeout: "120s"
  write_timeout: "120s"
  idle_timeout: "180s"
  request_timeout: "15m"

services:
  auth:
    base_url: "http://localhost:8081"
    timeout: "30s"
    retries: 3
  communication:
    base_url: "http://localhost:8082"
    timeout: "30s"
    retries: 3
  company:
    base_url: "http://localhost:8083"
    timeout: "30s"
    retries: 3
  user:
    base_url: "http://localhost:8085"
    timeout: "30s"
    retries: 3
  user_consents:
    base_url: "http://localhost:8086"
    timeout: "30s"
    retries: 3
  user_profile:
    base_url: "http://localhost:8091"
    timeout: "30s"
    retries: 3
  audit:
    base_url: "http://localhost:8620"
    timeout: "10s"
    retries: 2
  guardian:
    base_url: "http://localhost:8088"
    timeout: "20s"
    retries: 2
  collector:
    base_url: "http://localhost:8630"
    timeout: "5s"
    retries: 1
  knowledge:
    base_url: "http://localhost:8090"
    timeout: "60s"
    retries: 1

rabbitmq:
  host: "localhost"
  port: 5672
  user: "guest"
  password: "guest"
  vhost: "/"
  exchange: "ms-communication-exchange-local"
  #exchange: "ms-communication-exchange-dev"
  routing_key: "communication.message.send"
  durable: true
  auto_delete: false
  audit:
    enabled: true
    exchange: "srv-audit-exchange-local"
    routing_key: "audit.event"
    durable: true

jwt:
  secret: "Q2FjaG9ycm8gU2VndXJhbmNhIFByb2pldG8gS2VlcEd1YXJkIQ=="
  issuer: "keepguard"
  audience: "keepguard-api"

redis:
  host: ${REDIS_HOST:localhost}
  port: 6379
  password: ${REDIS_PASSWORD:}
  db: 0

rate_limit:
  enabled: true
  rules:
    register_init:
      limit: 100
      window: 60s
    register_resend:
      limit: 100
      window: 60s
    register_confirm:
      limit: 100
      window: 60s
    consents:
      limit: 500
      window: 60s
    users_me:
      limit: 120
      window: 60s
    connections_health:
      limit: 120
      window: 60s
    audits:
      limit: 120
      window: 60s
    guardian:
      limit: 60
      window: 60s
    collector:
      limit: 60
      window: 60s
    knowledge:
      limit: 30
      window: 60s
    default:
      limit: 500
      window: 60s

metrics:
  enabled: true
  scrape_path: "/metrics"
  port: "9090"

log:
  level: "debug"
  format: "json"


env: "local"

connections_health:
  snapshot_ttl: 60s
  lock_ttl: 5s
  probe_timeout: 500ms
  urls:
    front-keepguard-core: "http://localhost:5173/healthz"
    bff-auth: "http://localhost:8381/health"
    bff-core: "http://127.0.0.1:8282/health"
    ms-auth: "http://localhost:8081/actuator/health/liveness"
    ms-communication: "http://localhost:8082/actuator/health/liveness"
    ms-company: "http://localhost:8083/actuator/health/liveness"
    ms-user: "http://localhost:8085/actuator/health/liveness"
    ms-user-consents: "http://localhost:8086/actuator/health/liveness"
    srv-email-sender: "http://localhost:8601/health"
    srv-token-manager: "http://localhost:8700/health"
    srv-sms-sender: "http://localhost:8610/health"
    mock-sms-gateway: "http://localhost:8089/health"
    minio: "http://localhost:9000/minio/health/live"
    rabbitmq: "http://localhost:15672/api/health/checks/alarms"
    prometheus: "http://localhost:9095/-/healthy"
    grafana: "http://localhost:3001/api/health"
