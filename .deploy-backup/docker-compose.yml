    volumes:
      - ../../../backend/srv/srv-email-google-sender/secure:/app/secure:rw
    networks:
      - keepguard_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8601/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
