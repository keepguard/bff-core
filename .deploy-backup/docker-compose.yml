# docker-compose-api.yml
# Serviços essenciais para desenvolvimento da API
# Use: docker-compose -f docker-compose-api.yml up
services:
  postgres:
    image: postgres:15.5
    platform: linux/amd64
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keepguard_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Redis Cluster é gerenciado pelo docker-compose de storage
  # Os microsserviços se conectam aos nós do cluster via rede keepguard_net

  ms-auth:
    image: ghcr.io/keepguard/ms-auth:1.1.6-SNAPSHOT
    container_name: ms-auth
    pull_policy: always
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8081
    ports:
      - "${MS_AUTH_PORT}:8081"
    networks:
      - keepguard_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  ms-communication:
