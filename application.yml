version: "1.0.78-SNAPSHOT"

server:
  port: "8282"
  read_timeout: "120s"
  write_timeout: "120s"
  idle_timeout: "180s"
  request_timeout: "5m"

services:
  auth:
    base_url: "http://localhost:8081"
    timeout: "30s"
    retries: 3
  communication:
    base_url: "http://localhost:8082"
    timeout: "30s"
    retries: 3
  company:
    base_url: "http://localhost:8083"
    timeout: "30s"
    retries: 3
  user:
    base_url: "http://localhost:8085"
    timeout: "30s"
    retries: 3
  user-consents:
    base_url: "http://localhost:8086"
    timeout: "30s"
    retries: 3
  audit:
    base_url: "http://localhost:8620"
    timeout: "10s"
    retries: 2
  guardian:
    base_url: "http://localhost:8088"
    timeout: "20s"
    retries: 2
  collector:
    base_url: "http://localhost:8630"
    timeout: "5s"
    retries: 1
  knowledge:
    base_url: "http://localhost:8090"
    timeout: "60s"
    retries: 1
  llm:
    base_url: "http://localhost:8650"
    timeout: "60s"
    retries: 1

oauth:
  client_id: "bff-core"
  token_renew_before_sec: 600

rabbitmq:
  host: "localhost"
  port: 5672
  user: "guest"
  password: "guest"
  vhost: "/"
  exchange: "ms-communication-exchange-local"
  routing_key: "communication.message.send"
  durable: true
  auto_delete: false


jwt:
  secret: "Q2FjaG9ycm8gU2VndXJhbmNhIFByb2pldG8gS2VlcEd1YXJkIQ=="
  issuer: "keepguard"
  audience: "keepguard-api"
  jwks_url: ""
  signing_key: ""

metrics:
  enabled: true
  scrape_path: "/metrics"
  port: "9092"

log:
  level: "info"
  format: "json"


env: "dev"

