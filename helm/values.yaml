image:
  repository: ghcr.io/keepguard/bff-core
  tag: "1.0.20"
  pullPolicy: IfNotPresent

service:
  port: 8382

resources:
  limits:
    memory: 256Mi
  requests:
    memory: 128Mi

env:
  bffCoreEnv: dev
  rabbitmqHost: "rabbitmq-service"
  companyServiceUrl: "http://ms-company:8083"
  userServiceUrl: "http://ms-user:8085"
  authServiceUrl: "http://ms-auth:8081"
  communicationServiceUrl: "http://ms-communication:8082"
  userConsentsServiceUrl: "http://ms-user-consents:8086"
  userProfileServiceUrl: "http://ms-user-profile:8091"

imagePullSecrets:
  - name: ghcr-secret
