apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-core
  labels:
    app: bff-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff-core
  template:
    metadata:
      labels:
        app: bff-core
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: bff-core
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED
          value: "false"
        - name: BFF_CORE_ENV
          value: {{ .Values.env.bffCoreEnv | quote }}
        - name: BFF_CORE_RABBITMQ_HOST
          value: {{ .Values.env.rabbitmqHost | quote }}
        # O Service "rabbitmq" injeta RABBITMQ_PORT=tcp://<ip>:5672 em todo pod (service links) e a config lê
        # rabbitmq.port (BFF_CORE_RABBITMQ_PORT, senão RABBITMQ_PORT) como inteiro: porta explícita (05/11/2026).
        - name: BFF_CORE_RABBITMQ_PORT
          value: "5672"
        - name: BFF_CORE_RABBITMQ_USER
          valueFrom:
            configMapKeyRef:
              name: keepguard-config
              key: RABBITMQ_DEFAULT_USER
        - name: BFF_CORE_RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keepguard-secret
              key: RABBITMQ_DEFAULT_PASS
        - name: BFF_CORE_RABBITMQ_VHOST
          valueFrom:
            configMapKeyRef:
              name: keepguard-config
              key: RABBITMQ_VHOST
              optional: true
        - name: BFF_CORE_REDIS_HOST
          value: "redis"
        - name: BFF_CORE_SERVICES_COMPANY_BASE_URL
          value: {{ .Values.env.companyServiceUrl | quote }}
        - name: BFF_CORE_SERVICES_USER_BASE_URL
          value: {{ .Values.env.userServiceUrl | quote }}
        - name: BFF_CORE_SERVICES_AUTH_BASE_URL
          value: {{ .Values.env.authServiceUrl | quote }}
        - name: BFF_CORE_SERVICES_COMMUNICATION_BASE_URL
          value: {{ .Values.env.communicationServiceUrl | quote }}
        - name: BFF_CORE_SERVICES_USER_CONSENTS_BASE_URL
          value: {{ .Values.env.userConsentsServiceUrl | quote }}
        - name: BFF_CORE_SERVICES_USER_PROFILE_BASE_URL
          value: {{ .Values.env.userProfileServiceUrl | quote }}
        - name: BFF_CORE_SERVICES_AUDIT_BASE_URL
          value: {{ .Values.env.auditServiceUrl | quote }}
        - name: BFF_CORE_SERVICES_GUARDIAN_BASE_URL
          value: {{ .Values.env.guardianServiceUrl | quote }}
        - name: BFF_CORE_SERVICES_COLLECTOR_BASE_URL
          value: {{ .Values.env.collectorServiceUrl | quote }}
        - name: BFF_CORE_SERVICES_KNOWLEDGE_BASE_URL
          value: {{ .Values.env.knowledgeServiceUrl | quote }}
        - name: BFF_CORE_SERVICES_LLM_BASE_URL
          value: {{ .Values.env.llmServiceUrl | quote }}
        - name: BFF_CORE_SERVICES_BILLING_BASE_URL
          value: {{ .Values.env.billingServiceUrl | quote }}
        - name: KNOWLEDGE_BASE_URL
          value: {{ .Values.env.knowledgeServiceUrl | quote }}
        - name: AUTH_CLIENT_SECRET_BASE
          valueFrom:
            secretKeyRef:
              name: bff-core-oauth-key
              key: AUTH_CLIENT_SECRET_BASE
        # Chaves públicas do ms-auth (EdDSA); quem valida não precisa assinar.
        - name: BFF_CORE_JWT_JWKS_URL
          value: "http://ms-auth:8081/.well-known/jwks.json"
        # Client OAuth próprio do bff-core no ms-auth (token de serviço nas rotas administrativas do ms-user). Ausente = sem token.
        - name: KEEPGUARD_OAUTH_COMPANY_ID
          valueFrom:
            secretKeyRef:
              name: keepguard-secret
              key: BFF_CORE_OAUTH_COMPANY_ID
              optional: true
        - name: KEEPGUARD_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: keepguard-secret
              key: BFF_CORE_OAUTH_CLIENT_ID
              optional: true
        - name: KEEPGUARD_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: keepguard-secret
              key: BFF_CORE_OAUTH_CLIENT_SECRET
              optional: true
        - name: KEEPGUARD_VALIDATION_MODERATION_ENABLED
          value: "false"
        ports:
        - name: http
          containerPort: {{ .Values.service.port }}
        - name: metrics
          containerPort: {{ .Values.service.metricsPort }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.service.port }}
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
