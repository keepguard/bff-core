apiVersion: v1
kind: Service
metadata:
  name: bff-core-service
  labels:
    app: bff-core
spec:
  selector:
    app: bff-core
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
