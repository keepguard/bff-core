apiVersion: v1
kind: Service
metadata:
  name: bff-core-service
  labels:
    app: bff-core
spec:
  selector:
    app: bff-core
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
  - name: metrics
    port: {{ .Values.service.metricsPort }}
    targetPort: metrics
---
# Alias Docker Compose (hostname bff-core) para probes e clients internos.
apiVersion: v1
kind: Service
metadata:
  name: bff-core
  labels:
    app: bff-core
spec:
  selector:
    app: bff-core
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
  - name: metrics
    port: {{ .Values.service.metricsPort }}
    targetPort: metrics
