server:
  port: "8382"
  read_timeout: "120s"
  write_timeout: "120s"
  idle_timeout: "180s"
  request_timeout: "5m"

services:
  auth:
    base_url: "http://ms-auth:8081"
    timeout: "30s"
    retries: 3
  communication:
    base_url: "http://ms-communication:8082"
    timeout: "30s"
    retries: 3
  company:
    base_url: "http://ms-company:8083"
    timeout: "30s"
    retries: 3
  user:
    base_url: "http://ms-user:8085"
    timeout: "30s"
    retries: 3
  user_consents:
    base_url: "http://ms-user-consents:8086"
    timeout: "30s"
    retries: 3
  user_profile:
    base_url: "http://ms-user-profile:8091"
    timeout: "30s"
    retries: 3
  audit:
    base_url: "http://srv-audit:8620"
    timeout: "10s"
    retries: 2
  guardian:
    base_url: "http://ms-ai-guardian:8088"
    timeout: "20s"
    retries: 2
  collector:
    base_url: "http://srv-data-collector:8630"
    timeout: "5s"
    retries: 1
  knowledge:
    base_url: "http://ms-knowledge:8090"
    timeout: "60s"
    retries: 1

rabbitmq:
  host: "rabbitmq"
  port: 5672
  user: "guest"
  password: "guest"
  vhost: "/"
  exchange: "ms-communication-exchange-dev"
  routing_key: "communication.message.send"
  durable: true
  auto_delete: false
  audit:
    enabled: true
    exchange: "srv-audit-exchange-dev"
    routing_key: "audit.event"
    durable: true

jwt:
  secret: "Q2FjaG9ycm8gU2VndXJhbmNhIFByb2pldG8gS2VlcEd1YXJkIQ=="
  issuer: "keepguard"
  audience: "keepguard-api"

redis:
  host: ${REDIS_HOST:redis}
  port: 6379
  password: ${REDIS_PASSWORD:}
  db: 0

rate_limit:
  enabled: true
  rules:
    register_init:
      limit: 15
      window: 600s
    register_resend:
      limit: 10
      window: 300s
    register_confirm:
      limit: 15
      window: 300s
    consents:
      limit: 200
      window: 60s
    users_me:
      limit: 60
      window: 60s
    connections_health:
      limit: 30
      window: 60s
    audits:
      limit: 60
      window: 60s
    guardian:
      limit: 60
      window: 60s
    collector:
      limit: 60
      window: 60s
    knowledge:
      limit: 30
      window: 60s
    default:
      limit: 200
      window: 60s

metrics:
  enabled: true
  scrape_path: "/metrics"
  port: "9092"

log:
  level: "info"
  format: "json"


env: "dev"

connections_health:
  snapshot_ttl: 60s
  lock_ttl: 5s
  probe_timeout: 500ms
  urls:
    front-keepguard-core: "http://front-keepguard-core/healthz"
    bff-auth: "http://bff-auth:8381/health"
    bff-core: "http://127.0.0.1:8382/health"
    ms-auth: "http://ms-auth:8081/actuator/health/liveness"
    ms-communication: "http://ms-communication:8082/actuator/health/liveness"
    ms-company: "http://ms-company:8083/actuator/health/liveness"
    ms-user: "http://ms-user:8085/actuator/health/liveness"
    ms-user-consents: "http://ms-user-consents:8086/actuator/health/liveness"
    srv-email-sender: "http://srv-email-sender:8601/health"
    srv-token-manager: "http://srv-token-manager:8700/health"
    srv-sms-sender: "http://srv-sms-sender:8610/health"
    mock-sms-gateway: "http://mock-sms-gateway:8089/health"
    minio: "http://minio:9000/minio/health/live"
    rabbitmq: "http://rabbitmq:15672/api/health/checks/alarms"
    prometheus: "http://prometheus:9090/-/healthy"
    grafana: "http://grafana:3000/api/health"
