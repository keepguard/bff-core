server:
  port: "8382"
  read_timeout: "120s"
  write_timeout: "120s"
  idle_timeout: "180s"
  request_timeout: "5m"

services:
  auth:
    base_url: "http://ms-auth:8081"
    timeout: "30s"
    retries: 3
  communication:
    base_url: "http://ms-communication:8082"
    timeout: "30s"
    retries: 3
  company:
    base_url: "http://ms-company:8083"
    timeout: "30s"
    retries: 3
  user:
    base_url: "http://ms-user:8085"
    timeout: "30s"
    retries: 3
  user_consents:
    base_url: "http://ms-user-consents:8086"
    timeout: "30s"
    retries: 3
  user_profile:
    base_url: "http://ms-user-profile:8091"
    timeout: "30s"
    retries: 3

rabbitmq:
  host: "rabbitmq"
  port: 5672
  user: "guest"
  password: "guest"
  vhost: "/"
  exchange: "ms-communication-exchange-dev"
  routing_key: "communication.message.send"
  durable: true
  auto_delete: false

jwt:
  secret: "Q2FjaG9ycm8gU2VndXJhbmNhIFByb2pldG8gS2VlcEd1YXJkIQ=="
  issuer: "keepguard"
  audience: "keepguard-api"

redis:
  host: ${REDIS_HOST:redis}
  port: 6379
  password: ${REDIS_PASSWORD:}
  db: 0

rate_limit:
  enabled: true
  rules:
    register_init:
      limit: 15
      window: 600s
    register_resend:
      limit: 10
      window: 300s
    register_confirm:
      limit: 15
      window: 300s
    consents:
      limit: 200
      window: 60s
    default:
      limit: 200
      window: 60s

metrics:
  enabled: true
  scrape_path: "/metrics"
  port: "9092"

log:
  level: "info"
  format: "json"


env: "dev"
